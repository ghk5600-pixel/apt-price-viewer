<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>공급면적 검토함</title><link rel="stylesheet" href="./admin.css"></head>
<body><main><header><div><p>APT PRICE VIEWER · ADMIN</p><h1>공급면적 검토함</h1><span>자동 계산 실패 건과 수동 입력 이력을 관리합니다.</span></div><button id="exportButton" disabled>Excel용 CSV 내려받기</button></header>
<section id="login" class="card"><h2>관리자 인증</h2><p>Cloudflare에 등록한 <code>SUPPLY_ADMIN_TOKEN</code>을 이 브라우저 세션에서만 사용합니다.</p><input id="token" type="password" autocomplete="current-password" placeholder="관리자 토큰"><button id="loginButton">검토 목록 열기</button><small id="loginMessage"></small></section>
<section id="app" hidden><div class="summary"><strong id="caseCount">0건</strong><span>목록은 D1에 누적되며, 수동값은 자동 재계산 성공 전까지 우선 적용됩니다.</span></div><div id="caseList"></div></section>
</main><template id="caseTemplate"><article class="card case"><div class="case-head"><div><span class="badge"></span><h2 class="name"></h2><p class="address"></p></div><small class="detected"></small></div><dl class="facts"></dl><details><summary>수동 공급면적 입력</summary><p>출처 URL과 각 타입의 전용·공급면적·세대수를 입력합니다. 전용면적의 합계 세대수는 K-apt 세대수와 자동 비교됩니다.</p><label>검증 출처 URL<input class="source-url" type="url" placeholder="https://... (네이버부동산 또는 공식 분양자료)"></label><label>검토 메모<textarea class="note" rows="2" placeholder="예: 주상복합 아파트 3개동만 포함"></textarea></label><div class="groups"></div><button class="add-group" type="button">타입 추가</button><button class="save-manual" type="button">검증값 저장</button><small class="result"></small></details><details class="history"><summary>처리 이력</summary><ol class="event-list"></ol></details></article></template><template id="groupTemplate"><div class="group-row"><input class="group-label" placeholder="81타입"><input class="exclusive" type="number" step="0.01" placeholder="전용㎡"><input class="supply" type="number" step="0.01" placeholder="공급㎡"><input class="units" type="number" step="1" placeholder="세대수"><button class="remove-group" type="button">×</button></div></template><script type="module" src="./admin.js"></script></body></html>
